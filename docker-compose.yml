services:
  # DB
  postgres:
    image: pgvector/pgvector:pg16
    container_name: labsync_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: labsync_db
    ports:
      - "5433:5432"
    volumes:
      - labsync_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: labsync_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@labsync.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - labsync_pgadmin_data:/var/lib/pgadmin

  # 3. Server Express
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: labsync_server
    restart: always
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/labsync_db?schema=public"
      PORT: 5000
    volumes:
      - ./server:/app
      - labsync_server_node_modules:/app/node_modules
    depends_on:
      - postgres

  # 4. Client React
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: labsync_client
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000"
    volumes:
      - ./client:/app
      - labsync_client_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  labsync_postgres_data:
  labsync_pgadmin_data:
  labsync_server_node_modules:
  labsync_client_node_modules: